services:
  app:
    build:
      context: .
    image: be-ghep-chu-pt-pt:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4173
    healthcheck:
      test: ["CMD", "/usr/bin/node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3